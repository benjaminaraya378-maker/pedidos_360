# Arquitectura Kafka de Pedidos360 (EP5): 3 nodos Zookeeper + 3 brokers Kafka.
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml ps          # los 6 servicios en estado healthy
#   bash kafka/kafka-admin.sh cluster                       # quórum de Zookeeper y brokers registrados
#
# Por qué 3 + 3:
#   - Zookeeper guarda los metadatos del clúster (brokers vivos, controlador, configuración de tópicos). Un ensamble de
#     3 nodos tiene quórum con 2: sigue funcionando si cae 1 nodo.
#   - 3 brokers permiten factor de replicación 3: cada partición tiene 1 líder y 2 seguidores en brokers distintos.
#     Con min.insync.replicas=2 y acks=all, un mensaje confirmado está escrito en al menos 2 brokers, y se puede
#     seguir escribiendo con 1 broker caído.
#
# Listeners de cada broker:
#   INTERNO  (kafkaN:29092)       tráfico entre brokers y de Kafka UI, dentro de la red de Docker
#   EXTERNO  (localhost:909N)     microservicios Spring Boot que corren en el host (en la EC2, el mismo host)
# Los puertos se publican solo en 127.0.0.1, igual que RabbitMQ: no se abren a internet.
#
# Microservicios: KAFKA_BOOTSTRAP_SERVERS=localhost:9092,localhost:9093,localhost:9094
# Kafka UI se levanta aparte con docker-compose.kafka-ui.yml (usa la red pedidos360-kafka que crea este archivo).
name: pedidos360-kafka

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  networks: [kafka]
  healthcheck:
    # "srvr" responde "Mode: leader" o "Mode: follower" solo cuando el nodo ya forma parte del quórum
    test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/2181 && echo srvr >&3 && grep -qE \"Mode: (leader|follower)\" <&3'"]
    interval: 10s
    timeout: 5s
    retries: 18
    start_period: 15s

x-zookeeper-env: &zookeeper-env
  ZOOKEEPER_CLIENT_PORT: 2181
  ZOOKEEPER_TICK_TIME: 2000
  ZOOKEEPER_INIT_LIMIT: 5          # ticks que tiene un seguidor para conectarse y sincronizarse con el líder
  ZOOKEEPER_SYNC_LIMIT: 2          # ticks de atraso máximo de un seguidor antes de quedar fuera del quórum
  ZOOKEEPER_SERVERS: zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888
  KAFKA_HEAP_OPTS: -Xms64m -Xmx128m

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  networks: [kafka]
  depends_on:
    zookeeper1: { condition: service_healthy }
    zookeeper2: { condition: service_healthy }
    zookeeper3: { condition: service_healthy }
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:29092 >/dev/null 2>&1"]
    interval: 15s
    timeout: 10s
    retries: 20
    start_period: 30s

x-kafka-env: &kafka-env
  KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
  # Valores por defecto del clúster: tolerancia a la caída de 1 broker sin perder mensajes confirmados
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3          # __consumer_offsets (offsets de los consumer groups)
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_UNCLEAN_LEADER_ELECTION_ENABLE: "false"      # nunca elegir como líder una réplica atrasada (perdería datos)
  # Los tópicos se crean explícitamente (microservicio dueño, ms-kafka-admin o kafka/kafka-admin.sh), nunca por error
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 3000
  KAFKA_HEAP_OPTS: -Xms256m -Xmx384m

services:
  zookeeper1:
    <<: *zookeeper
    container_name: zookeeper1
    hostname: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zookeeper1-data:/var/lib/zookeeper/data
      - zookeeper1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper
    container_name: zookeeper2
    hostname: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zookeeper2-data:/var/lib/zookeeper/data
      - zookeeper2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    container_name: zookeeper3
    hostname: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zookeeper3-data:/var/lib/zookeeper/data
      - zookeeper3-log:/var/lib/zookeeper/log

  kafka1:
    <<: *kafka
    container_name: kafka1
    hostname: kafka1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka1:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    container_name: kafka2
    hostname: kafka2
    ports:
      - "127.0.0.1:9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka2:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    container_name: kafka3
    hostname: kafka3
    ports:
      - "127.0.0.1:9094:9094"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_LISTENERS: INTERNO://0.0.0.0:29092,EXTERNO://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka3:29092,EXTERNO://${KAFKA_HOST_EXTERNO:-localhost}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

networks:
  kafka:
    name: pedidos360-kafka

volumes:
  zookeeper1-data:
  zookeeper1-log:
  zookeeper2-data:
  zookeeper2-log:
  zookeeper3-data:
  zookeeper3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:
