server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: ms-pedidos
  # Propiedades de conexión a la base de datos cloud (Amazon RDS MySQL)
  datasource:
    url: ${DB_URL:jdbc:mysql://REEMPLAZAR-ENDPOINT-RDS:3306/pedidos360_pedidos?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:REEMPLAZAR-PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:update}
    open-in-view: false
  # Conexión al broker RabbitMQ
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    # Clúster de 2 nodos: RABBITMQ_ADDRESSES=localhost:5672,localhost:5673. Sin la variable, un solo broker (host:port)
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # Si el broker no responde, la creación del pedido no queda esperando más de esto
    connection-timeout: 5s
    listener:
      simple:
        # Cada consumidor confirma con basicAck / basicNack de forma explícita
        acknowledge-mode: manual
        prefetch: 10
  # Cliente Kafka (EP5). Brokers del docker-compose.kafka.yml; el resto de la configuración está en kafka/KafkaConfig
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092,localhost:9093,localhost:9094}
    client-id: ms-pedidos
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # El valor lo serializa KafkaConfig: DTO → JSON (JsonSerializer), byte[] → tal cual (reenvíos al DLT)
      acks: all                              # el líder confirma cuando las réplicas en sincronía (mín. 2) escribieron
      properties:
        enable.idempotence: true             # un reintento del productor no duplica ni desordena mensajes
        max.in.flight.requests.per.connection: 5
        # Tiempo total para que Kafka confirme o rechace un envío, reintentos incluidos. Menor que
        # pedidos360.kafka.publicacion.espera-confirmacion-ms: el productor siempre responde antes de que se acabe la espera
        delivery.timeout.ms: 12000
        request.timeout.ms: 10000
        max.block.ms: 5000                   # si Kafka no responde, send() no retiene la petición HTTP más de 5 s
        linger.ms: 5                         # espera 5 ms para agrupar mensajes en un mismo lote
        compression.type: lz4
        # Tipo lógico en el header __TypeId__: cada consumidor lo traduce a su propia clase (no comparten código).
        # inventarioEvento se usa al reenviar al DLT un evento de inventario que no se pudo procesar
        spring.json.type.mapping: pedidoEvento:cl.duoc.pedidos360.kafka.evento.PedidoEvento,inventarioEvento:cl.duoc.pedidos360.kafka.evento.InventarioEvento
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer: si el JSON es ilegible no se cae el consumidor; el error llega al DefaultErrorHandler
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      auto-offset-reset: earliest            # un grupo nuevo empieza desde el primer mensaje disponible
      enable-auto-commit: false              # el offset lo confirma el contenedor después de procesar (ack-mode)
      max-poll-records: 50
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.type.mapping: inventarioEvento:cl.duoc.pedidos360.kafka.evento.InventarioEvento
        spring.json.value.default.type: cl.duoc.pedidos360.kafka.evento.InventarioEvento
        spring.json.trusted.packages: cl.duoc.pedidos360.kafka.evento
        session.timeout.ms: 15000            # si un consumidor deja de responder 15 s, sus particiones se reasignan
        heartbeat.interval.ms: 3000
        # Rebalanceo incremental: al entrar o salir un consumidor, los demás siguen con sus particiones
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
    listener:
      ack-mode: record                       # confirma el offset de cada evento apenas termina de procesarse
      concurrency: 3                         # 3 hilos consumidores: uno por partición
      missing-topics-fatal: false            # si el tópico aún no existe, el servicio arranca igual y espera
    admin:
      operation-timeout: 10s                 # si Kafka no está al iniciar, no retrasa el arranque más de 10 s

pedidos360:
  security:
    # Valores del IDaaS (copiar desde un token decodificado en https://jwt.ms)
    issuer: ${JWT_ISSUER:https://REEMPLAZAR-TENANT-ID.ciamlogin.com/REEMPLAZAR-TENANT-ID/v2.0}
    jwk-set-uri: ${JWT_JWKS_URI:https://REEMPLAZAR-SUBDOMINIO.ciamlogin.com/REEMPLAZAR-TENANT-ID/discovery/v2.0/keys}
    audiences: ${JWT_AUDIENCE:REEMPLAZAR-CLIENT-ID-API}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  clients:
    # URL interna de ms-productos (en EC2: http://localhost:8081)
    productos-url: ${PRODUCTOS_URL:http://localhost:8081}
  # Nombres de exchanges, colas, DLQ y bindings: se definen SOLO aquí y los usa RabbitMQConfig
  messaging:
    exchange: pedidos360.pedidos.exchange          # topic: eventos del dominio pedidos
    dead-letter-exchange: pedidos360.pedidos.dlx   # direct: recibe los mensajes rechazados por los consumidores
    pedido-creado-routing-key: pedido.creado       # routing key con la que se publica cada pedido nuevo
    max-reintentos: 3                              # reintentos ante errores recuperables antes de ir a la DLQ
    retry-delay-ms: 1000                           # espera antes de cada reintento: intento N espera N x este valor (ms)
    notificaciones:                                # caso de uso 1: avisar al cliente que su pedido fue recibido
      cola: pedidos360.notificaciones.queue
      binding-key: pedido.creado
      dlq: pedidos360.notificaciones.dlq
    comprobantes:                                  # caso de uso 2: generar el comprobante (ticket) del pedido
      cola: pedidos360.comprobantes.queue
      binding-key: pedido.creado
      dlq: pedidos360.comprobantes.dlq
    auditoria:                                     # caso de uso 3: registrar la auditoría de cada pedido creado
      cola: pedidos360.auditoria.queue
      binding-key: pedido.creado
      dlq: pedidos360.auditoria.dlq
  # Tópicos, grupos y reintentos de Kafka: se definen SOLO aquí y los usan KafkaConfig, productores y consumidores
  kafka:
    topicos:
      pedidos:                        # dueño: ms-pedidos (KafkaAdmin lo crea al iniciar con estos parámetros)
        nombre: pedidos360.pedidos
        particiones: 3                # hasta 3 consumidores en paralelo por grupo
        replicas: 3                   # 1 líder + 2 copias en brokers distintos: tolera la caída de 1 broker
        cleanup-policy: delete        # es un historial de eventos: se borra por antigüedad
        retencion-ms: 604800000       # 7 días para reprocesar (p. ej. reconstruir la analítica tras una caída)
        min-insync-replicas: 2        # con acks=all, cada evento confirmado queda en al menos 2 brokers
      inventario:                     # dueño: ms-productos; aquí solo se consume
        nombre: pedidos360.inventario
    dlt:
      sufijo: .dlt                    # pedidos360.pedidos.dlt
      retencion-ms: 1209600000        # 14 días para revisar y reprocesar los eventos fallidos
    grupos:
      estado-pedidos: pedidos360-estado-pedidos
    reintentos:
      maximo: 3                       # 3 reintentos ante errores recuperables, luego al DLT
      espera-inicial-ms: 1000         # 1 s, 2 s, 4 s
      multiplicador: 2.0
      espera-maxima-ms: 10000
    publicacion:
      # PEDIDO_CONFIRMADO / PEDIDO_CANCELADO se publican antes del commit y se espera la confirmación del broker hasta
      # este tiempo; si Kafka no confirma, se deshace el cambio de estado y el evento de inventario se reintenta.
      # Debe ser mayor que spring.kafka.producer.properties.delivery.timeout.ms
      espera-confirmacion-ms: ${KAFKA_ESPERA_CONFIRMACION_MS:15000}
    outbox:
      # PEDIDO_CREADO se guarda en la tabla eventos_kafka_pendientes en la misma transacción que el pedido y se
      # publica después del commit. Si Kafka no lo confirma, el relé lo reintenta en cada vuelta hasta lograrlo
      intervalo-ms: ${KAFKA_OUTBOX_INTERVALO_MS:2000}   # pausa entre una vuelta del relé y la siguiente
      # El relé solo toma eventos con más de 20 s: para entonces el intento inmediato ya terminó (max.block.ms 5 s +
      # delivery.timeout.ms 12 s) y no compiten. Si coincidieran, los consumidores descartan el duplicado por eventoId
      antiguedad-minima-ms: 20000
      lote: 50                        # eventos que el relé toma por vuelta
  comprobantes:
    # Carpeta donde se escriben los tickets generados por el consumidor de comprobantes
    directorio: ${COMPROBANTES_DIR:${java.io.tmpdir}/pedidos360-comprobantes}
