# "Nube local": reemplaza en este PC los dos servicios de nube que no son Docker en EP1-EP4.
#   - Keycloak = IDaaS (en la nube: Microsoft Entra External ID). Tenant (realm) "pedidos360" con usuarios, roles
#     Admin / Cliente y login OAuth 2.0 / OpenID Connect con Authorization Code + PKCE.
#   - Kong = API Manager (en la nube: AWS API Gateway). Rutas /api/** hacia cada microservicio, validación del JWT
#     (firma, emisor y vencimiento: 401 si falta o es inválido) y CORS para el frontend.
# Uso (desde backend-pedidos360):
#   docker compose -f docker-compose.nube-local.yml up -d
#   bash nube-local/kong/configurar-kong.sh          # carga rutas, JWT y CORS en Kong con la clave del tenant
# Consolas: Keycloak http://localhost:8180/admin (admin / admin) · Kong Manager http://localhost:8002
# Todo se publica solo en 127.0.0.1. Los microservicios corren en el PC (host.docker.internal) con
# demo-local/servicios.sh y las variables de demo-local/keycloak.env.
name: pedidos360-nube-local

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # Poca memoria: Keycloak en modo desarrollo no necesita más para un tenant de prueba
      JAVA_OPTS_KC_HEAP: "-Xms64m -Xmx384m"
    volumes:
      - ./nube-local/keycloak/pedidos360-realm.json:/opt/keycloak/data/import/pedidos360-realm.json:ro
    ports:
      - "127.0.0.1:8180:8080"

  kong:
    image: kong:3.9.0
    container_name: kong
    environment:
      KONG_DATABASE: "off"                       # modo sin base de datos: la configuración se carga con configurar-kong.sh
      KONG_NGINX_WORKER_PROCESSES: "1"           # un proceso basta para la demo (por defecto uno por núcleo: mucha RAM)
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_ADMIN_GUI_LISTEN: "0.0.0.0:8002"      # Kong Manager (consola web)
      KONG_ADMIN_GUI_URL: "http://localhost:8002"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"   # API Gateway: el frontend llama aquí
      - "127.0.0.1:8001:8001"   # Admin API
      - "127.0.0.1:8002:8002"   # Kong Manager
